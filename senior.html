<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Senior Admin Dashboard</title>
<style>
:root{font-family:Arial,Helvetica,sans-serif;color:#172033;background:#f5f8fc}*{box-sizing:border-box}body{margin:0}.topbar{display:flex;align-items:center;justify-content:space-between;padding:18px 5%;background:#fff;border-bottom:1px solid #e2e8f0}.brand{font-size:20px;font-weight:800;color:#10213f}.top-actions{display:flex;gap:10px}.top-actions a{padding:9px 13px;border:1px solid #e2e8f0;border-radius:7px;color:#10213f;text-decoration:none}main{max-width:1200px;margin:auto;padding:32px 5%}.heading{margin-bottom:22px}.heading h1{margin:0 0 8px;font-size:30px}.heading p,.muted{color:#64748b}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.card{padding:22px;background:#fff;border:1px solid #e2e8f0;border-radius:10px}.stat h2{margin:0;color:#64748b;font-size:14px;font-weight:600}.value{margin-top:12px;font-size:28px;font-weight:800;color:#10213f}.notice{display:none;margin:0 0 18px;padding:14px;border-left:4px solid #b91c1c;border-radius:6px;background:#fee2e2;color:#7f1d1d}.notice.visible{display:block}.loading{color:#64748b}@media(max-width:760px){.stats{grid-template-columns:repeat(2,1fr)}main{padding:24px 18px}}@media(max-width:480px){.stats{grid-template-columns:1fr}.topbar{padding:16px 18px}.top-actions{gap:6px}.top-actions a{padding:8px;font-size:12px}}
</style>
<style>html:not(.authorized){visibility:hidden}</style>
</head>
<body>
<header class="topbar">
  <div class="brand">TaskEarn <span class="muted">Senior Admin</span></div>
  <nav class="top-actions" aria-label="Dashboard navigation"></nav>
</header>
<main>
  <section class="heading">
    <h1>Senior Admin Dashboard</h1>
    <p>Live platform totals from TaskEarn accounts and activity.</p>
  </section>
  <div id="dashboardNotice" class="notice" role="alert"></div>
  <section class="stats" aria-live="polite">
    <article class="card stat"><h2>Member accounts</h2><div class="value loading" id="memberCount">Loading…</div></article>
    <article class="card stat"><h2>Total earnings</h2><div class="value loading" id="totalEarnings">Loading…</div></article>
    <article class="card stat"><h2>Pending withdrawal requests</h2><div class="value loading" id="pendingWithdrawals">Loading…</div></article>
    <article class="card stat"><h2>Tasks completed</h2><div class="value loading" id="tasksCompleted">Loading…</div></article>
  </section>
</main>
<script src="senior-client.js"></script>
</body>
</html>
